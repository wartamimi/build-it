name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platforms 36 and 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :engine:project:test :engine:layout:test :engine:blocks:test :engine:editor:test :engine:build:test :engine:ai:test --stacktrace
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  device:
    # Runs the instrumented tests on an emulator: on-device build of a Java project with the
    # downloaded platform, install + launch + console bridge, Claude SDK and Keystore on ART.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Instrumented tests on an emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Print device test failures
        if: always()
        run: |
          for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  print('FAILED', case.get('classname'), case.get('name'))
                  print((bad.text or '')[:4000])
          PY
          done
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release-apk:
    # The installable APK, built only after unit and device tests pass. Signed when the release
    # key secrets are configured; otherwise uploaded unsigned.
    needs: [test, device]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.BUILDIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "BUILDIT_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          BUILDIT_KEYSTORE_PASSWORD: ${{ secrets.BUILDIT_KEYSTORE_PASSWORD }}
          BUILDIT_KEY_ALIAS: ${{ secrets.BUILDIT_KEY_ALIAS }}
          BUILDIT_KEY_PASSWORD: ${{ secrets.BUILDIT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: build-it-apk
          path: app/build/outputs/apk/release/*.apk
